<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla tilkoblet</title>
<style>body{font-family:system-ui;max-width:560px;margin:40px auto;padding:0 16px}code{display:block;word-break:break-all;background:#eee;padding:12px;border-radius:8px}button{margin-top:12px;padding:10px 16px;font-size:16px}</style>
<h2>Nesten ferdig</h2><p>Kopier koden under og lim den inn i det sikre feltet hos Tesla Ready.</p><code id="c"></code><button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent);this.textContent='Kopiert'">Kopier kode</button>
<script>const p=new URLSearchParams(location.search);document.getElementById('c').textContent=p.get('code')||('Feil: '+(p.get('error_description')||p.get('error')||'ingen kode'));</script>
